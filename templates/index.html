<!-- rule_engine/templates/rule_engine/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule Engine</title>
    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: #4CAF50;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        label {
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 20px;
            font-size: 1.1rem;
            padding: 10px;
            background: #e0f7fa;
            border-left: 5px solid #00acc1;
            display: none;
            transition: all 0.3s ease;
        }

        .error {
            background-color: #ffcccb;
            color: #b71c1c;
            border-left: 5px solid #d32f2f;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Rule Engine</h1>
    <div class="container">
        <form id="rule-form">
            <label for="rule">Enter Rule:</label>
            <input type="text" id="rule" name="rule" placeholder="e.g., age > 30 AND salary > 50000">
            <button type="submit">Submit Rule</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('rule-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const ruleInput = document.getElementById('rule');
            const rule = ruleInput.value;
            const resultDiv = document.getElementById('result');

            if (rule.trim() === '') {
                resultDiv.innerText = 'Please enter a rule!';
                resultDiv.classList.add('error');
                resultDiv.style.display = 'block';
                return;
            }

            // Clear previous results
            resultDiv.style.display = 'none';
            resultDiv.classList.remove('error');

            fetch('/create-rule/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ rule: rule }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.rule_id) {
                    resultDiv.innerText = 'Rule successfully submitted! Rule ID: ' + data.rule_id;
                    resultDiv.classList.remove('error');
                    resultDiv.style.display = 'block';
                } else {
                    resultDiv.innerText = 'Error submitting rule. Please try again.';
                    resultDiv.classList.add('error');
                    resultDiv.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.innerText = 'An error occurred. Please try again.';
                resultDiv.classList.add('error');
                resultDiv.style.display = 'block';
            });
        });
    </script>
</body>
</html>
